<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outpost Pocket Kit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outpost">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<script>
/* Apply saved theme and language before the page paints. Dark is the default. */
(function(){var h=document.documentElement,t="dark",l="en";
  try{t=JSON.parse(localStorage.getItem("outpost.theme"))||"dark";l=JSON.parse(localStorage.getItem("outpost.lang"))||"en";}catch(e){}
  h.setAttribute("data-theme",t==="light"?"light":"dark");
  if(l==="ar"){h.lang="ar";h.dir="rtl";}})();
</script>
<style>
/* Layout idea: a field instrument. One column, thumb-reach tab bar, mono labels for readouts, signal orange for the one thing to act on.
   System fonts only, on purpose: this page must open with no network at all. */
:root{
  --ground:#eceee8; --panel:#f8f9f5; --sunk:#e1e4dc; --line:#c9cec3;
  --ink:#1b211d; --muted:#5c665e; --signal:#b4500a; --signal-ink:#ffffff;
  --good:#1f7a45; --warn:#a36a00; --crit:#b3261e;
  --paper:#fbf6ea; --paper-ink:#2a2418; --gold:#94660f;
  --display: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101412; --panel:#181d1a; --sunk:#0b0e0c; --line:#2b332e;
    --ink:#e7ece6; --muted:#93a096; --signal:#ff9838; --signal-ink:#1a0f02;
    --good:#6fd08c; --warn:#f0c04a; --crit:#ff7a6b;
    --paper:#16140f; --paper-ink:#ece4d2; --gold:#d9b35e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#101412; --panel:#181d1a; --sunk:#0b0e0c; --line:#2b332e;
  --ink:#e7ece6; --muted:#93a096; --signal:#ff9838; --signal-ink:#1a0f02;
  --good:#6fd08c; --warn:#f0c04a; --crit:#ff7a6b;
    --paper:#16140f; --paper-ink:#ece4d2; --gold:#d9b35e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
a{color:var(--signal)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 92px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 17px/1 var(--display);letter-spacing:.18em;display:block}
.brand span{font:12px/1.2 var(--display);color:var(--muted);display:block;margin-top:4px}
.pill{font:600 11px/1 var(--display);letter-spacing:.08em;padding:7px 10px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--panel)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.off i{background:var(--warn)}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font:600 11px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font:700 20px/1.25 var(--body)}
h3{font:650 16px/1.3 var(--body)}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{min-height:110px;resize:vertical;font-family:var(--display);font-size:15px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.out{background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:12px;font:15px/1.45 var(--display);white-space:pre-wrap;overflow-wrap:anywhere;min-height:48px}
.out.err{color:var(--crit);border-color:var(--crit)}
/* readiness */
.ready{flex-direction:row;align-items:center;gap:16px}
.ring{width:112px;height:112px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke:var(--signal);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.ring .num small{font:600 10px/1 var(--display);letter-spacing:.12em;color:var(--muted);margin-top:5px}
.bars{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.bar{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:start}
.bar span{display:flex;justify-content:space-between;font:600 12px/1.2 var(--display);gap:8px}
.bar span em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.track b{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .4s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile b{font-size:15px}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile.sos{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.tile.sos span{color:inherit;opacity:.85}
.map{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;font-size:14px;align-items:center}
.map .h{font:600 11px/1.2 var(--display);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.map .a{color:var(--muted)}
.map .n{color:var(--muted)}
/* stack */
.appcard header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{font:600 11px/1 var(--display);letter-spacing:.08em;padding:6px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.tag.done{color:var(--good);border-color:var(--good)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{border-top:1px solid var(--line)}
.steps label{display:flex;gap:12px;padding:11px 0;align-items:flex-start;font-size:15px;line-height:1.4}
.steps input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;border:2px solid var(--muted);border-radius:7px;margin:0;display:grid;place-content:center;background:var(--sunk)}
.steps input:checked{background:var(--good);border-color:var(--good)}
.steps input:checked::after{content:"";width:6px;height:11px;border:solid var(--panel);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.steps input:checked + span{color:var(--muted);text-decoration:line-through}
.tip{font-size:14px;color:var(--muted);border-inline-start:3px solid var(--signal);padding-inline-start:10px}
.plan{display:flex;flex-direction:column}
.plan .pr{display:grid;grid-template-columns:28px 1fr 84px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.plan .pr input[type=checkbox]{width:22px;height:22px;accent-color:var(--signal);margin:0}
.plan .pr input[type=number]{min-height:38px;padding:6px 8px;text-align:end;font-family:var(--display);font-size:16px}
.meter{height:14px;border-radius:9px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter b{display:block;height:100%;background:var(--good);transition:width .3s}
.meter.warn b{background:var(--warn)} .meter.crit b{background:var(--crit)}
.big{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:start;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font:600 11px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:0}
td.num{font:700 15px/1.3 var(--display);white-space:nowrap}
.scroll{overflow-x:auto}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
/* notes */
.note{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.note b{font-size:16px}
.note span{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note time{font:11px/1 var(--display);color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
#noteBody{min-height:46vh;font-family:var(--body);font-size:16px}
/* field */
details.ref{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.ref summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary .k{font:700 10px/1 var(--display);letter-spacing:.1em;padding:5px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);flex:none;width:52px;text-align:center}
details.ref summary .k.aid{color:var(--crit);border-color:var(--crit)}
details.ref summary b{flex:1;font-size:16px;line-height:1.3}
details.ref summary::after{content:"+";font:400 22px/1 var(--display);color:var(--muted)}
details.ref[open] summary::after{content:"−"}
details.ref .bd{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
details.ref ol,details.ref ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:7px;font-size:15px;line-height:1.45}
.never{font-size:14px;border-inline-start:3px solid var(--crit);padding-inline-start:10px}
.never b{color:var(--crit)}
.kitgroup{display:flex;flex-direction:column}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font:600 11px/1 var(--display);letter-spacing:.04em;min-height:52px;border-radius:10px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--signal)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:88vw;text-align:center}
.toast.on{opacity:1}
/* beacon: fixed colors on purpose, it is a light source */
.beacon{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;color:#777;text-align:center;padding:24px;border:0;width:100%}
.beacon.show{display:flex}
.beacon.lit{background:#fff;color:#999}
.beacon b{font:700 34px/1.1 var(--display);letter-spacing:.2em}
.beacon span{font:14px/1.4 var(--display);overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 0;line-height:1.5}
/* ---------- Quran and azkar (Arabic mode only) ---------- */
@font-face{font-family:"Amiri Quran";src:url(amiri-quran.woff2) format("woff2");font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
html:not([lang="ar"]) .ar-only{display:none!important}
body.noscroll{overflow:hidden}
.qbar{display:flex;align-items:center;gap:8px}
.qinfo{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.qinfo b{font:400 21px/1.2 "Amiri Quran",serif;color:var(--gold)}
.qinfo span{font-size:12px;color:var(--muted)}
.qsize{display:flex;gap:4px}
.qsize .btn{padding:6px 9px}
.qtrack{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px color-mix(in srgb,var(--gold) 45%,transparent)}
.qtrack::-webkit-scrollbar{display:none}
.qpage{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:18px 18px 12px;color:var(--paper-ink);display:flex;flex-direction:column}
.qtext{font:400 var(--qfs,24px)/2.15 "Amiri Quran",serif;text-align:justify;margin:0 0 6px;word-spacing:1px}
.ayn{color:var(--gold);font-size:.82em;white-space:nowrap}
.basmala{font:400 calc(var(--qfs,24px) + 1px)/2 "Amiri Quran",serif;text-align:center;margin:0 0 4px}
.shead{margin:10px 0 8px;padding:8px 12px;text-align:center;border:1.5px solid var(--gold);border-radius:12px;background:color-mix(in srgb,var(--gold) 9%,transparent);position:relative;display:flex;flex-direction:column;gap:2px}
.shead::before,.shead::after{content:"۞";position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font:400 20px/1 "Amiri Quran",serif}
.shead::before{inset-inline-start:12px}.shead::after{inset-inline-end:12px}
.shead b{font:400 24px/1.3 "Amiri Quran",serif;color:var(--paper-ink)}
.shead span{font-size:12px;color:var(--muted)}
.qfoot{margin-top:auto;padding-top:10px;text-align:center;font:400 15px/1 "Amiri Quran",serif;color:var(--gold)}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qnav .sub{font-size:12px;text-align:center}
.btn:disabled{opacity:.4}
/* bottom sheet: surah index */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--ground);width:100%;max-width:640px;height:88%;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet-top{display:flex;align-items:center;justify-content:space-between}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.slist{overflow-y:auto;flex:1;display:flex;flex-direction:column;margin:0 -4px;padding:0 4px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.srow.on{background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:10px}
.snum{flex:none;width:40px;height:40px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--gold);border:1.5px solid var(--gold);border-radius:50% 12px}
.sname{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sname b{font:400 20px/1.25 "Amiri Quran",serif}
.sname small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sname i{width:8px;height:8px;border-radius:50%;flex:none}
.sname i.mk{background:var(--gold)}.sname i.md{background:var(--good)}
.spg{flex:none;font-size:13px;color:var(--muted);min-width:32px;text-align:end}
/* azkar */
.ztile{min-height:96px;justify-content:flex-end}
.ztile b{font-size:17px}
.ztile.morning{background:linear-gradient(135deg,#f6c36a,#e9894a);border-color:transparent;color:#2b1503}
.ztile.evening{background:linear-gradient(135deg,#34407a,#1b2142);border-color:transparent;color:#eef0ff}
.ztile span{color:inherit;opacity:.85}
.glist,.clist{display:flex;flex-direction:column;gap:8px}
.grow2,.crow{display:flex;flex-direction:column;gap:3px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative}
.grow2::after,.crow::after{content:"‹";position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);font-size:22px;color:var(--muted)}
.grow2 b,.crow b{font-size:16px;padding-inline-end:20px}
.grow2 span,.crow span{font-size:13px;color:var(--muted)}
.zcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;transition:opacity .3s,border-color .3s;scroll-margin-top:12px}
.zcard.done{opacity:.55;border-color:var(--good)}
.zcat{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;color:var(--muted)}
.ztext{font:400 21px/2 "Amiri Quran",serif;margin:0}
.zdesc{font-size:14px;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.zfoot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.zcount{flex:none;width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink)}
.zcount b{font-size:22px;line-height:1}
.zcount small{font-size:9px;color:var(--muted)}
.zcard.done .zcount{border-color:var(--good);color:var(--good)}
.zcount:active{transform:scale(.94)}
.zmeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ztag{font-size:13px;font-weight:700;color:var(--gold)}
.zref{font-size:12px;color:var(--muted)}
.zprog{display:flex;align-items:center;gap:10px}
.zprog .meter{flex:1}
body[data-view="quran"] .foot{display:none}
/* ---------- games ---------- */
.gcards{display:flex;flex-direction:column;gap:12px}
.gcard{display:flex;align-items:center;gap:16px;text-align:start;border-radius:18px;padding:18px;border:0;min-height:108px;color:#fff;position:relative;overflow:hidden}
.gcard.chesscard{background:linear-gradient(135deg,#3b2f2a,#7a5a3a)}
.gcard.blockcard{background:linear-gradient(135deg,#5b2bbf,#2a84d8)}
.gicon{flex:none;width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:46px;line-height:1}
.blockcard .gicon{place-items:stretch;grid-template-columns:22px 22px;grid-template-rows:22px 22px;gap:4px;place-content:center}
.blockcard .gicon i{border-radius:5px;background:#ffb627;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blockcard .gicon i:nth-child(2){background:#4cc9f0}.blockcard .gicon i:nth-child(3){background:#7bd389}.blockcard .gicon i:nth-child(4){background:#f25f5c}
.gtxt{display:flex;flex-direction:column;gap:4px;min-width:0}
.gtxt b{font-size:20px}
.gtxt span{font-size:14px;opacity:.85}

"Check for danger, then tap the shoulders and shout. No response: shout for help and call the emergency number, on speaker.":"تأكد من عدم وجود خطر، ثم اربت على كتفيه وناده بصوت عالٍ. إن لم يستجب: اطلب المساعدة واتصل برقم الطوارئ مع تشغيل مكبّر الصوت.",
"Tilt the head back, lift the chin, and check for normal breathing for no more than 10 seconds.":"أمِل الرأس للخلف وارفع الذقن، وافحص التنفس الطبيعي لمدة لا تزيد على 10 ثوانٍ.",
"Not breathing normally: put the heel of your hand on the centre of the chest, other hand on top, arms straight.":"إن لم يكن يتنفس بشكل طبيعي: ضع أسفل راحة يدك على منتصف الصدر، واليد الأخرى فوقها، مع فرد الذراعين.",
"Push hard and fast: 5 to 6 cm deep, 100 to 120 pushes a minute, letting the chest rise fully each time.":"اضغط بقوة وبسرعة: بعمق 5 إلى 6 سم، بمعدل 100 إلى 120 ضغطة في الدقيقة، مع ترك الصدر يرتفع بالكامل بعد كل ضغطة.",
"If trained, give 2 rescue breaths after every 30 pushes. If not, keep pushing without stopping.":"إن كنت مدرّبًا، أعطِ نفَسين إنقاذيين بعد كل 30 ضغطة. وإن لم تكن، استمر في الضغط دون توقف.",
"Use a defibrillator (AED) the moment one arrives and follow its voice prompts.":"استخدم جهاز الصدمات الكهربائية (AED) فور وصوله واتبع تعليماته الصوتية.",
"Keep going until help takes over or the person starts breathing.":"استمر حتى يتولى المسعفون الأمر أو يبدأ الشخص بالتنفس.",
"Do not stop to re-check for a pulse. Swap with another rescuer every 2 minutes if you can.":"لا تتوقف لفحص النبض مرة أخرى. تبادل مع مسعف آخر كل دقيقتين إن أمكن.",
"Severe bleeding":"نزيف شديد",
"Press firmly and directly on the wound with a clean cloth or your hand. Use a glove or plastic bag as a barrier if you have one.":"اضغط بقوة مباشرة على الجرح بقطعة قماش نظيفة أو بيدك. استخدم قفازًا أو كيسًا بلاستيكيًا كحاجز إن وُجد.",
"Keep pressing. If blood soaks through, add more cloth on top. Do not lift the first layer.":"استمر في الضغط. إذا تشبّع القماش بالدم، أضف قماشًا آخر فوقه. لا ترفع الطبقة الأولى.",
"Lay the person down and keep them warm.":"مدّد الشخص على الأرض وحافظ على دفئه.",
"Limb bleeding that is life-threatening and will not stop: put a tourniquet 5 to 7 cm above the wound, not over a joint. Tighten until the bleeding stops and write down the time.":"نزيف في أحد الأطراف يهدد الحياة ولا يتوقف: ضع رباطًا ضاغطًا (تورنيكيه) على بعد 5 إلى 7 سم فوق الجرح، وليس على مفصل. شدّه حتى يتوقف النزيف ودوّن الوقت.",
"Get emergency help. Do not loosen a tourniquet once it is on.":"اطلب المساعدة الطارئة. لا ترخِ الرباط الضاغط بعد وضعه.",
"Do not remove an object stuck in a wound. Pad around it and press on either side.":"لا تنزع جسمًا عالقًا في الجرح. ضع حشوة حوله واضغط على جانبيه.",
"Choking (adult or child over 1)":"الاختناق (بالغ أو طفل فوق سنة)",
"If they can cough or speak, tell them to keep coughing.":"إن كان يستطيع السعال أو الكلام، اطلب منه الاستمرار في السعال.",
"If they cannot: lean them forward and give up to 5 sharp back blows between the shoulder blades with the heel of your hand.":"إن لم يستطع: أمِله للأمام ووجّه حتى 5 ضربات قوية على الظهر بين لوحي الكتف بأسفل راحة يدك.",
"Still blocked: give up to 5 abdominal thrusts. Stand behind, fist just above the navel, pull sharply in and up.":"إن ظل مسدودًا: أعطِ حتى 5 ضغطات على البطن. قف خلفه، وضع قبضتك فوق السرّة مباشرة، واسحب بقوة للداخل وللأعلى.",
"Alternate 5 back blows and 5 thrusts. Call the emergency number.":"بدّل بين 5 ضربات على الظهر و5 ضغطات على البطن. اتصل برقم الطوارئ.",
"If they go unresponsive, lower them to the ground and start CPR.":"إذا فقد الوعي، أنزله إلى الأرض وابدأ الإنعاش القلبي الرئوي.",
"Babies under 1 need a different method: back blows and chest thrusts, face down along your forearm. No abdominal thrusts.":"الرضّع تحت سنة يحتاجون طريقة مختلفة: ضربات على الظهر وضغطات على الصدر، ووجه الرضيع لأسفل على ساعدك. بدون ضغطات على البطن.",
"Unresponsive but breathing: recovery position":"فاقد الوعي لكنه يتنفس: وضعية الإفاقة",
"Kneel beside them. Place the arm nearest you out at a right angle.":"اجثُ بجانبه. ضع ذراعه الأقرب إليك ممدودة بزاوية قائمة.",
"Bring the far hand across and hold the back of it against their near cheek.":"اسحب يده البعيدة عبر صدره وثبّت ظهرها على خده القريب منك.",
"Pull the far knee up, then roll them toward you onto their side.":"ارفع ركبته البعيدة، ثم اقلبه نحوك على جنبه.",
"Tilt the head back slightly so the airway stays open and fluid can drain.":"أمِل الرأس للخلف قليلًا ليبقى مجرى الهواء مفتوحًا وتخرج السوائل.",
"Call for help and keep checking their breathing.":"اطلب المساعدة واستمر في مراقبة تنفسه.",
"If you suspect a spinal injury, move them only if the airway is at risk.":"إذا اشتبهت في إصابة بالعمود الفقري، لا تحرّكه إلا إذا كان مجرى الهواء في خطر.",
"Burns":"الحروق",
"Cool the burn under cool running water for 20 minutes. Start as soon as possible.":"برّد الحرق تحت ماء جارٍ بارد لمدة 20 دقيقة. ابدأ في أسرع وقت ممكن.",
"Remove rings, watches and clothing near the burn, unless stuck to the skin.":"انزع الخواتم والساعات والملابس القريبة من الحرق، إلا إذا كانت ملتصقة بالجلد.",
"Cover loosely with cling film or a clean, non-fluffy cloth.":"غطِّه بشكل فضفاض بغلاف بلاستيكي شفاف أو قطعة قماش نظيفة لا تترك وبرًا.",
"Get medical help for burns bigger than the person's hand, burns on the face, hands or groin, deep burns, chemical or electrical burns, and any burn on a child.":"اطلب مساعدة طبية للحروق الأكبر من كف الشخص، وحروق الوجه أو اليدين أو منطقة العانة، والحروق العميقة، والحروق الكيميائية أو الكهربائية، وأي حرق لدى طفل.",
"No ice, butter, oil or toothpaste. Do not burst blisters.":"لا ثلج ولا زبدة ولا زيت ولا معجون أسنان. لا تفقأ الفقاعات.",
"Shock (pale, cold, clammy, fast pulse)":"الصدمة (شحوب، برودة، عرق بارد، نبض سريع)",
"Lay the person down. Raise the legs if injuries allow.":"مدّد الشخص. ارفع ساقيه إذا سمحت الإصابات.",
"Treat the cause you can see, such as bleeding.":"عالج السبب الظاهر، مثل النزيف.",
"Keep them warm with a blanket or coat.":"حافظ على دفئه ببطانية أو معطف.",
"Call the emergency number. Watch their breathing and response.":"اتصل برقم الطوارئ. راقب تنفسه واستجابته.",
"Give nothing to eat or drink.":"لا تعطه شيئًا يأكله أو يشربه.",
"Broken bones and sprains":"الكسور والالتواءات",
"Keep the injured part still in the position you found it.":"أبقِ الجزء المصاب ثابتًا في الوضع الذي وجدته عليه.",
"Pad and splint it, covering the joints above and below the injury.":"ضع حشوة وجبيرة تغطي المفصلين فوق الإصابة وتحتها.",
"Check fingers or toes beyond the injury for colour, warmth and feeling.":"افحص الأصابع بعد موضع الإصابة من حيث اللون والدفء والإحساس.",
"A wrapped cold pack helps swelling. 15 to 20 minutes at a time.":"الكمادة الباردة الملفوفة تخفف التورم، لمدة 15 إلى 20 دقيقة في كل مرة.",
"Cover an open wound with a clean dressing before splinting.":"غطِّ الجرح المفتوح بضمادة نظيفة قبل التجبير.",
"Do not try to straighten a bone or push it back in.":"لا تحاول تعديل العظم أو إعادته إلى مكانه.",
"Heat exhaustion and heat stroke":"الإجهاد الحراري وضربة الشمس",
"Heat exhaustion (heavy sweat, headache, weakness, nausea): move to shade, lie down, loosen clothing, sip water or rehydration drink, cool with wet cloths and fanning.":"الإجهاد الحراري (تعرّق غزير، صداع، ضعف، غثيان): انتقل إلى الظل واستلقِ، وخفّف الملابس، واشرب الماء أو محلول الإرواء على رشفات، وبرّد الجسم بقطع قماش مبللة والتهوية.",
"Heat stroke (confusion, collapse, very hot skin, 40 °C or more) is an emergency. Call for help.":"ضربة الشمس (تشوّش، انهيار، جلد شديد السخونة، 40 °م أو أكثر) حالة طارئة. اطلب المساعدة.",
"Cool them fast: cold water immersion if possible, otherwise soak the skin and fan hard, with cold packs at the neck, armpits and groin.":"برّده بسرعة: اغمره في ماء بارد إن أمكن، وإلا فبلّل الجلد وهوِّ عليه بقوة، مع كمادات باردة على الرقبة والإبطين وأعلى الفخذين.",
"Keep cooling until help arrives.":"استمر في التبريد حتى تصل المساعدة.",
"Do not give drinks to someone who is confused or drowsy.":"لا تعطِ مشروبات لشخص مشوّش أو نعسان.",
"Hypothermia":"انخفاض حرارة الجسم",
"Get out of wind and wet. Insulate them from the ground.":"ابتعد عن الرياح والبلل. اعزله عن الأرض.",
"Replace wet clothing with dry layers. Cover the head.":"استبدل الملابس المبللة بطبقات جافة. غطِّ الرأس.",
"Warm the chest, neck and groin first, with blankets or skin contact.":"دفّئ الصدر والرقبة وأعلى الفخذين أولًا، بالبطانيات أو بملامسة الجلد.",
"If fully alert, give warm sweet drinks.":"إذا كان واعيًا تمامًا، أعطه مشروبات دافئة محلّاة.",
"Handle them gently. Severe cases (drowsy, slurred speech, shivering has stopped) need emergency help.":"تعامل معه برفق. الحالات الشديدة (نعاس، تلعثم في الكلام، توقف الارتجاف) تحتاج مساعدة طارئة.",
"No alcohol. Do not rub the arms and legs, and do not use very hot water.":"لا كحول. لا تفرك الذراعين والساقين، ولا تستخدم ماءً شديد السخونة.",
"Dehydration and rehydration drink":"الجفاف ومحلول الإرواء",
"Signs: dark urine, dry mouth, dizziness, headache, tiredness.":"العلامات: بول داكن، جفاف الفم، دوخة، صداع، تعب.",
"Mix 1 litre of safe water with 6 level teaspoons of sugar and half a level teaspoon of salt.":"اخلط لترًا واحدًا من الماء الآمن مع 6 ملاعق صغيرة مستوية من السكر ونصف ملعقة صغيرة مستوية من الملح.",
"Take small sips often, especially after vomiting or diarrhoea.":"اشرب رشفات صغيرة بشكل متكرر، خاصة بعد القيء أو الإسهال.",
"Rest in shade and avoid effort in the heat of the day.":"استرح في الظل وتجنب المجهود في وقت الحر.",
"Get medical help for confusion, no urine in 8 hours, or if fluids will not stay down.":"اطلب مساعدة طبية عند التشوّش، أو عدم التبول لمدة 8 ساعات، أو إذا لم تبقَ السوائل في المعدة.",
"Severe allergic reaction":"حساسية شديدة",
"Signs: swelling of the face or throat, trouble breathing, widespread rash, faintness.":"العلامات: تورم الوجه أو الحلق، صعوبة التنفس، طفح جلدي منتشر، شعور بالإغماء.",
"If they carry an adrenaline auto-injector, use it in the outer thigh straight away.":"إذا كان يحمل حقنة أدرينالين ذاتية، استخدمها فورًا في الجانب الخارجي من الفخذ.",
"Call the emergency number and say anaphylaxis.":"اتصل برقم الطوارئ وقل إنها صدمة حساسية (تأق).",
"Lay them flat with legs raised. If breathing is hard, let them sit up.":"مدّده مع رفع ساقيه. وإذا كان التنفس صعبًا، دعه يجلس.",
"A second injector can be used after 5 minutes if there is no improvement.":"يمكن استخدام حقنة ثانية بعد 5 دقائق إذا لم يحدث تحسن.",
"Do not let them stand or walk, even if they feel better.":"لا تدعه يقف أو يمشي، حتى لو شعر بتحسن.",
"Snake bite":"لدغة ثعبان",
"Move away from the snake. Keep the person calm and as still as possible.":"ابتعد عن الثعبان. حافظ على هدوء الشخص وأبقه ساكنًا قدر الإمكان.",
"Remove rings and tight items near the bite.":"انزع الخواتم وأي شيء ضيق قريب من اللدغة.",
"Keep the bitten limb still, at about heart level.":"أبقِ الطرف الملدوغ ثابتًا عند مستوى القلب تقريبًا.",
"Get to a hospital as fast as you safely can. Note the time and what the snake looked like.":"توجّه إلى المستشفى بأسرع ما يمكن بأمان. دوّن الوقت وشكل الثعبان.",
"Do not cut, suck, ice or tourniquet the bite. Do not try to catch the snake.":"لا تجرح مكان اللدغة ولا تمصّه ولا تضع عليه ثلجًا أو رباطًا ضاغطًا. لا تحاول الإمساك بالثعبان.",
"Make water safe to drink":"اجعل الماء آمنًا للشرب",
"Cloudy water: let it settle, then pour through a clean cloth first.":"الماء العكر: اتركه حتى يترسب، ثم صفّه أولًا عبر قطعة قماش نظيفة.",
"Boil: bring to a rolling boil for 1 minute. Above about 2,000 m, boil for 3 minutes. Let it cool covered.":"الغلي: اغلِه غليانًا قويًا لمدة دقيقة واحدة. فوق ارتفاع 2,000 م تقريبًا، اغلِه 3 دقائق. اتركه يبرد وهو مغطى.",
"Bleach, if you cannot boil: plain unscented household bleach (5 to 9%). 2 drops per litre of clear water, 4 if cloudy. Stir and wait 30 minutes. It should smell faintly of chlorine.":"الكلور إذا لم تستطع الغلي: كلور منزلي عادي بدون رائحة (5 إلى 9%). نقطتان لكل لتر من الماء الصافي، و4 نقاط إن كان عكرًا. حرّك وانتظر 30 دقيقة. يجب أن تكون فيه رائحة كلور خفيفة.",
"Purification tablets: follow the packet.":"أقراص التنقية: اتبع التعليمات على العبوة.",
"Store treated water in clean, closed containers.":"خزّن الماء المعالج في أوعية نظيفة ومغلقة.",
"Boiling and bleach kill germs. They do not remove fuel, chemicals or salt.":"الغلي والكلور يقتلان الجراثيم، لكنهما لا يزيلان الوقود أو المواد الكيميائية أو الملح.",
"How much water, and where to find it":"كم تحتاج من الماء، وأين تجده",
"Plan on about 4 litres per person per day for drinking and basic hygiene, for at least 3 days. More in heat.":"احسب حوالي 4 لترات للشخص يوميًا للشرب والنظافة الأساسية، لمدة 3 أيام على الأقل. وأكثر في الحر.",
"Safe emergency sources at home: the water heater tank, melted ice cubes, liquid from canned food.":"مصادر طوارئ آمنة في البيت: خزان سخان المياه، ومكعبات الثلج المذابة، والسائل الموجود في المعلبات.",
"Collect rainwater in clean containers, then treat it.":"اجمع مياه الأمطار في أوعية نظيفة، ثم عالجها.",
"Drink what you need today. Rationing water too hard makes you less able to find more.":"اشرب ما تحتاجه اليوم. التقتير الشديد في الماء يضعف قدرتك على إيجاد المزيد.",
"Do not drink from radiators, waterbeds or pools.":"لا تشرب من مياه الرادياتير أو الأسرّة المائية أو حمامات السباحة.",
"Food when the power is out":"الطعام عند انقطاع الكهرباء",
"Keep fridge and freezer doors shut.":"أبقِ بابي الثلاجة والفريزر مغلقين.",
"A closed fridge keeps food safe for about 4 hours.":"الثلاجة المغلقة تحفظ الطعام آمنًا لحوالي 4 ساعات.",
"A full freezer holds for about 48 hours, a half-full one about 24.":"الفريزر الممتلئ يصمد حوالي 48 ساعة، ونصف الممتلئ حوالي 24 ساعة.",
"Eat fridge food first, then freezer food, then shelf-stable food.":"كُل طعام الثلاجة أولًا، ثم طعام الفريزر، ثم الأطعمة التي لا تحتاج تبريدًا.",
"Throw out meat, dairy and leftovers that sat above 4 °C for more than 4 hours.":"تخلّص من اللحوم ومنتجات الألبان وبقايا الطعام التي بقيت فوق 4 °م لأكثر من 4 ساعات.",
"Never taste food to test it. When in doubt, throw it out.":"لا تتذوق الطعام لتختبره أبدًا. إن شككت فيه، تخلّص منه.",
"The rule of threes":"قاعدة الثلاثات",
"About 3 minutes without air.":"حوالي 3 دقائق بلا هواء.",
"About 3 hours without shelter in harsh cold or heat.":"حوالي 3 ساعات بلا مأوى في البرد أو الحر القاسي.",
"About 3 days without water.":"حوالي 3 أيام بلا ماء.",
"About 3 weeks without food.":"حوالي 3 أسابيع بلا طعام.",
"Use this order to decide what to fix first.":"استخدم هذا الترتيب لتقرر ما تعالجه أولًا.",
"Shelter basics":"أساسيات المأوى",
"Get out of wind, rain and direct sun before anything else.":"ابتعد عن الرياح والمطر وأشعة الشمس المباشرة قبل أي شيء آخر.",
"Insulate yourself from the ground. It takes heat faster than air.":"اعزل نفسك عن الأرض، فهي تسحب الحرارة أسرع من الهواء.",
"Small spaces are warmer. Build only as big as you need.":"الأماكن الصغيرة أدفأ. ابنِ بالحجم الذي تحتاجه فقط.",
"In heat, rest in shade through midday and move early or late.":"في الحر، استرح في الظل وقت الظهيرة وتحرّك في الصباح الباكر أو المساء.",
"Stay with a broken-down vehicle. It is shelter and easier to spot.":"ابقَ بجانب السيارة المعطلة، فهي مأوى ويسهل رصدها.",
"Never run a generator, grill or charcoal fire indoors or in a tent. Carbon monoxide kills without warning.":"لا تشغّل مولدًا أو شوّاية أو فحمًا داخل المنزل أو الخيمة أبدًا. أول أكسيد الكربون يقتل دون إنذار.",
"Start a fire":"إشعال النار",
"Clear a bare patch of ground away from anything that burns.":"نظّف بقعة من الأرض بعيدًا عن أي شيء قابل للاشتعال.",
"Gather three piles before you light: tinder (dry grass, paper, lint), kindling (pencil-thin sticks), fuel (wrist-thick wood).":"اجمع ثلاث كومات قبل الإشعال: مادة الإشعال (عشب جاف، ورق، وبر)، وأعواد رفيعة بسُمك القلم، ووقود (حطب بسُمك المعصم).",
"Light the tinder, add kindling slowly, and leave gaps for air.":"أشعل مادة الإشعال، وأضف الأعواد الرفيعة ببطء، واترك فراغات للهواء.",
"Add fuel once the kindling burns steadily.":"أضف الحطب عندما تشتعل الأعواد بثبات.",
"Put it out fully: drown, stir, and feel for heat.":"أطفئها تمامًا: اغمرها بالماء، وقلّبها، وتحسّس الحرارة.",
"Signal for rescue":"إشارات طلب الإنقاذ",
"Three of anything means distress: three whistle blasts, three flashes, three fires.":"ثلاثة من أي شيء تعني الاستغاثة: ثلاث صفارات، ثلاث ومضات، ثلاث نيران.",
"SOS in Morse is three short, three long, three short. The beacon in Tools flashes it for you.":"إشارة SOS بشفرة مورس هي ثلاث قصيرة، ثلاث طويلة، ثلاث قصيرة. منارة SOS في الأدوات تومضها لك.",
"Aim mirror or screen flashes at aircraft and distant people.":"وجّه ومضات المرآة أو الشاشة نحو الطائرات والأشخاص البعيدين.",
"Ground signals for aircraft: a large V means you need help, a large X means you need medical help. Make them at least 3 m long in a colour that contrasts with the ground.":"إشارات أرضية للطائرات: حرف V كبير يعني أنك تحتاج مساعدة، وحرف X كبير يعني أنك تحتاج مساعدة طبية. اجعلها بطول 3 م على الأقل وبلون يتباين مع الأرض.",
"A text message gets through on weaker signal than a call.":"الرسالة النصية تصل بإشارة أضعف مما تحتاجه المكالمة.",
"Some newer iPhones can text emergency services by satellite in supported regions. Check if yours can before you rely on it.":"بعض أجهزة iPhone الأحدث يمكنها مراسلة الطوارئ عبر القمر الصناعي في المناطق المدعومة. تحقّق من دعم جهازك قبل الاعتماد عليه.",
"Find direction without a compass":"تحديد الاتجاه بدون بوصلة",
"The sun rises roughly in the east and sets roughly in the west.":"تشرق الشمس تقريبًا من الشرق وتغرب تقريبًا في الغرب.",
"Shadow stick: push a stick upright in flat ground and mark the shadow tip. Wait 15 to 20 minutes and mark it again. The first mark is west, the second is east.":"عصا الظل: اغرس عصا رأسيًا في أرض مستوية وعلّم طرف ظلها. انتظر 15 إلى 20 دقيقة وعلّمه مرة أخرى. العلامة الأولى هي الغرب، والثانية هي الشرق.",
"Analog watch, northern hemisphere: point the hour hand at the sun. South lies halfway between the hour hand and 12.":"ساعة بعقارب، في نصف الكرة الشمالي: وجّه عقرب الساعات نحو الشمس. الجنوب يقع في منتصف المسافة بين عقرب الساعات والرقم 12.",
"Night, northern hemisphere: the two stars at the end of the Big Dipper's bowl point to the North Star.":"ليلًا في نصف الكرة الشمالي: النجمان في طرف وعاء الدب الأكبر يشيران إلى النجم القطبي.",
"Night, southern hemisphere: extend the long axis of the Southern Cross about 4.5 times its length. The point below that is roughly south.":"ليلًا في نصف الكرة الجنوبي: مدّ المحور الطويل للصليب الجنوبي نحو 4.5 أضعاف طوله. النقطة أسفل ذلك هي الجنوب تقريبًا.",
"If you are lost: STOP":"إذا ضللت الطريق: توقّف",
"Stop. Sit down and stay calm.":"توقّف. اجلس وحافظ على هدوئك.",
"Think. When did you last know where you were?":"فكّر. متى كانت آخر مرة عرفت فيها مكانك؟",
"Observe. Check landmarks, weather, daylight, water and what you carry.":"لاحظ. تفقّد المعالم والطقس وضوء النهار والماء وما تحمله.",
"Plan. If someone knows your route, staying put is usually the best choice.":"خطّط. إذا كان أحد يعرف مسارك، فالبقاء في مكانك غالبًا هو الخيار الأفضل.",
"Make yourself visible and audible, and save your phone battery.":"اجعل نفسك مرئيًا ومسموعًا، ووفّر بطارية هاتفك.",
"Make your phone battery last":"إطالة عمر بطارية الهاتف",

"Use Airplane Mode and check for signal briefly at set times.":"استخدم وضع الطيران وافحص الإشارة لفترة قصيرة في أوقات محددة.",

"Keep the phone warm in cold weather and shaded in heat.":"أبقِ الهاتف دافئًا في البرد وفي الظل في الحر.",
"Download maps and reference packs before you leave coverage.":"نزّل الخرائط والحزم المرجعية قبل أن تخرج من نطاق التغطية.",

"Keep fridge and freezer closed.":"أبقِ الثلاجة والفريزر مغلقين.",

const isAr=()=>S.lang==="ar";
const tr=s=>{ if(!isAr()) return s; const v=AR[s]; if(v===undefined){ (window.__miss||(window.__miss=new Set())).add(s); return s; } return v; };
function applyStatic(){
  const h=document.documentElement; h.lang=isAr()?"ar":"en"; h.dir=isAr()?"rtl":"ltr";
  $$("[data-en]").forEach(e=>e.textContent=isAr()&&e.dataset.ar?e.dataset.ar:tr(e.dataset.en));
  $$("[data-en-label]").forEach(e=>e.setAttribute("aria-label",tr(e.dataset.enLabel)));
  $("#swLang").setAttribute("aria-checked",isAr()?"true":"false");
  $("#swTheme").setAttribute("aria-checked",S.theme==="light"?"true":"false");
}
function setLang(l){ S.lang=l; store.set("lang",l); applyStatic(); net(); drawAcctBits(); renderAcct(); show(S.view,true); }
function setTheme(t){ S.theme=t; store.set("theme",t); document.documentElement.setAttribute("data-theme",t); applyStatic(); }

const REF=[
 {c:"aid",t:"Not breathing: CPR for an adult",s:["Check for danger, then tap the shoulders and shout. No response: shout for help and call the emergency number, on speaker.","Tilt the head back, lift the chin, and check for normal breathing for no more than 10 seconds.","Not breathing normally: put the heel of your hand on the centre of the chest, other hand on top, arms straight.","Push hard and fast: 5 to 6 cm deep, 100 to 120 pushes a minute, letting the chest rise fully each time.","If trained, give 2 rescue breaths after every 30 pushes. If not, keep pushing without stopping.","Use a defibrillator (AED) the moment one arrives and follow its voice prompts.","Keep going until help takes over or the person starts breathing."],n:"Do not stop to re-check for a pulse. Swap with another rescuer every 2 minutes if you can."},
 {c:"aid",t:"Severe bleeding",s:["Press firmly and directly on the wound with a clean cloth or your hand. Use a glove or plastic bag as a barrier if you have one.","Keep pressing. If blood soaks through, add more cloth on top. Do not lift the first layer.","Lay the person down and keep them warm.","Limb bleeding that is life-threatening and will not stop: put a tourniquet 5 to 7 cm above the wound, not over a joint. Tighten until the bleeding stops and write down the time.","Get emergency help. Do not loosen a tourniquet once it is on."],n:"Do not remove an object stuck in a wound. Pad around it and press on either side."},
 {c:"aid",t:"Choking (adult or child over 1)",s:["If they can cough or speak, tell them to keep coughing.","If they cannot: lean them forward and give up to 5 sharp back blows between the shoulder blades with the heel of your hand.","Still blocked: give up to 5 abdominal thrusts. Stand behind, fist just above the navel, pull sharply in and up.","Alternate 5 back blows and 5 thrusts. Call the emergency number.","If they go unresponsive, lower them to the ground and start CPR."],n:"Babies under 1 need a different method: back blows and chest thrusts, face down along your forearm. No abdominal thrusts."},
 {c:"aid",t:"Unresponsive but breathing: recovery position",s:["Kneel beside them. Place the arm nearest you out at a right angle.","Bring the far hand across and hold the back of it against their near cheek.","Pull the far knee up, then roll them toward you onto their side.","Tilt the head back slightly so the airway stays open and fluid can drain.","Call for help and keep checking their breathing."],n:"If you suspect a spinal injury, move them only if the airway is at risk."},
 {c:"aid",t:"Burns",s:["Cool the burn under cool running water for 20 minutes. Start as soon as possible.","Remove rings, watches and clothing near the burn, unless stuck to the skin.","Cover loosely with cling film or a clean, non-fluffy cloth.","Get medical help for burns bigger than the person's hand, burns on the face, hands or groin, deep burns, chemical or electrical burns, and any burn on a child."],n:"No ice, butter, oil or toothpaste. Do not burst blisters."},
 {c:"aid",t:"Shock (pale, cold, clammy, fast pulse)",s:["Lay the person down. Raise the legs if injuries allow.","Treat the cause you can see, such as bleeding.","Keep them warm with a blanket or coat.","Call the emergency number. Watch their breathing and response."],n:"Give nothing to eat or drink."},
 {c:"aid",t:"Broken bones and sprains",s:["Keep the injured part still in the position you found it.","Pad and splint it, covering the joints above and below the injury.","Check fingers or toes beyond the injury for colour, warmth and feeling.","A wrapped cold pack helps swelling. 15 to 20 minutes at a time.","Cover an open wound with a clean dressing before splinting."],n:"Do not try to straighten a bone or push it back in."},
 {c:"aid",t:"Heat exhaustion and heat stroke",s:["Heat exhaustion (heavy sweat, headache, weakness, nausea): move to shade, lie down, loosen clothing, sip water or rehydration drink, cool with wet cloths and fanning.","Heat stroke (confusion, collapse, very hot skin, 40 °C or more) is an emergency. Call for help.","Cool them fast: cold water immersion if possible, otherwise soak the skin and fan hard, with cold packs at the neck, armpits and groin.","Keep cooling until help arrives."],n:"Do not give drinks to someone who is confused or drowsy."},
 {c:"aid",t:"Hypothermia",s:["Get out of wind and wet. Insulate them from the ground.","Replace wet clothing with dry layers. Cover the head.","Warm the chest, neck and groin first, with blankets or skin contact.","If fully alert, give warm sweet drinks.","Handle them gently. Severe cases (drowsy, slurred speech, shivering has stopped) need emergency help."],n:"No alcohol. Do not rub the arms and legs, and do not use very hot water."},
 {c:"aid",t:"Dehydration and rehydration drink",s:["Signs: dark urine, dry mouth, dizziness, headache, tiredness.","Mix 1 litre of safe water with 6 level teaspoons of sugar and half a level teaspoon of salt.","Take small sips often, especially after vomiting or diarrhoea.","Rest in shade and avoid effort in the heat of the day."],n:"Get medical help for confusion, no urine in 8 hours, or if fluids will not stay down."},
 {c:"aid",t:"Severe allergic reaction",s:["Signs: swelling of the face or throat, trouble breathing, widespread rash, faintness.","If they carry an adrenaline auto-injector, use it in the outer thigh straight away.","Call the emergency number and say anaphylaxis.","Lay them flat with legs raised. If breathing is hard, let them sit up.","A second injector can be used after 5 minutes if there is no improvement."],n:"Do not let them stand or walk, even if they feel better."},
 {c:"aid",t:"Snake bite",s:["Move away from the snake. Keep the person calm and as still as possible.","Remove rings and tight items near the bite.","Keep the bitten limb still, at about heart level.","Get to a hospital as fast as you safely can. Note the time and what the snake looked like."],n:"Do not cut, suck, ice or tourniquet the bite. Do not try to catch the snake."},
 {c:"water",t:"Make water safe to drink",s:["Cloudy water: let it settle, then pour through a clean cloth first.","Boil: bring to a rolling boil for 1 minute. Above about 2,000 m, boil for 3 minutes. Let it cool covered.","Bleach, if you cannot boil: plain unscented household bleach (5 to 9%). 2 drops per litre of clear water, 4 if cloudy. Stir and wait 30 minutes. It should smell faintly of chlorine.","Purification tablets: follow the packet.","Store treated water in clean, closed containers."],n:"Boiling and bleach kill germs. They do not remove fuel, chemicals or salt."},
 {c:"water",t:"How much water, and where to find it",s:["Plan on about 4 litres per person per day for drinking and basic hygiene, for at least 3 days. More in heat.","Safe emergency sources at home: the water heater tank, melted ice cubes, liquid from canned food.","Collect rainwater in clean containers, then treat it.","Drink what you need today. Rationing water too hard makes you less able to find more."],n:"Do not drink from radiators, waterbeds or pools."},
 {c:"water",t:"Food when the power is out",s:["Keep fridge and freezer doors shut.","A closed fridge keeps food safe for about 4 hours.","A full freezer holds for about 48 hours, a half-full one about 24.","Eat fridge food first, then freezer food, then shelf-stable food.","Throw out meat, dairy and leftovers that sat above 4 °C for more than 4 hours."],n:"Never taste food to test it. When in doubt, throw it out."},
 {c:"shelter",t:"The rule of threes",s:["About 3 minutes without air.","About 3 hours without shelter in harsh cold or heat.","About 3 days without water.","About 3 weeks without food.","Use this order to decide what to fix first."]},
 {c:"shelter",t:"Shelter basics",s:["Get out of wind, rain and direct sun before anything else.","Insulate yourself from the ground. It takes heat faster than air.","Small spaces are warmer. Build only as big as you need.","In heat, rest in shade through midday and move early or late.","Stay with a broken-down vehicle. It is shelter and easier to spot."],n:"Never run a generator, grill or charcoal fire indoors or in a tent. Carbon monoxide kills without warning."},
 {c:"shelter",t:"Start a fire",s:["Clear a bare patch of ground away from anything that burns.","Gather three piles before you light: tinder (dry grass, paper, lint), kindling (pencil-thin sticks), fuel (wrist-thick wood).","Light the tinder, add kindling slowly, and leave gaps for air.","Add fuel once the kindling burns steadily.","Put it out fully: drown, stir, and feel for heat."]},
 {c:"signal",t:"Signal for rescue",s:["Three of anything means distress: three whistle blasts, three flashes, three fires.","SOS in Morse is three short, three long, three short. The beacon in Tools flashes it for you.","Aim mirror or screen flashes at aircraft and distant people.","Ground signals for aircraft: a large V means you need help, a large X means you need medical help. Make them at least 3 m long in a colour that contrasts with the ground.","A text message gets through on weaker signal than a call.","Some newer iPhones can text emergency services by satellite in supported regions. Check if yours can before you rely on it."]},
 {c:"signal",t:"Find direction without a compass",s:["The sun rises roughly in the east and sets roughly in the west.","Shadow stick: push a stick upright in flat ground and mark the shadow tip. Wait 15 to 20 minutes and mark it again. The first mark is west, the second is east.","Analog watch, northern hemisphere: point the hour hand at the sun. South lies halfway between the hour hand and 12.","Night, northern hemisphere: the two stars at the end of the Big Dipper's bowl point to the North Star.","Night, southern hemisphere: extend the long axis of the Southern Cross about 4.5 times its length. The point below that is roughly south."]},
 {c:"signal",t:"If you are lost: STOP",s:["Stop. Sit down and stay calm.","Think. When did you last know where you were?","Observe. Check landmarks, weather, daylight, water and what you carry.","Plan. If someone knows your route, staying put is usually the best choice.","Make yourself visible and audible, and save your phone battery."]},

/* ---------- progress ---------- */
function stackProg(id){const a=STACK.find(x=>x.id===id); const done=a.steps.filter((_,i)=>S.checks[id+"."+i]).length; return [done,a.steps.length];}
function progress(){
  let sd=0,st=0; STACK.forEach(a=>{const [d,t]=stackProg(a.id); sd+=d; st+=t;});
  let kd=0,kt=0; KIT.forEach((g,gi)=>g[1].forEach((_,i)=>{kt++; if(S.kit[gi+"."+i])kd++;}));
  const inst=installed()?1:0;
  return {sd,st,kd,kt,inst,pct:Math.round(100*(0.5*sd/st+0.35*kd/kt+0.15*inst))};
}

function updatePlan(){
  let tot=0; PLAN.forEach(p=>{const s=S.plan[p[0]]; if(s.on) tot+=(+s.gb||0);});
  $("#planTotal").textContent=(Math.round(tot*10)/10)+" GB";
  const free=parseFloat(S.free), m=$("#planMeter"), msg=$("#planMsg");
  m.className="meter";
  if(!(free>0)){ m.firstElementChild.style.width="0%"; msg.textContent=tr("Enter your free space to see if this fits."); return; }
  const r=tot/free; m.firstElementChild.style.width=Math.min(100,r*100)+"%";
  const over=Math.round((tot-free)*10)/10, spare=Math.round((free-tot)*10)/10;
  if(r>1){m.classList.add("crit"); msg.textContent=isAr()?"أكبر من المساحة بـ "+over+" GB. ألغِ تحديد شيء أو اختر نسخة أصغر من ويكيبيديا.":"Too big by "+over+" GB. Untick something or pick a smaller Wikipedia edition.";}
  else if(r>0.8){m.classList.add("warn"); msg.textContent=tr("It fits, but leaves under 20% free. iPhones slow down when nearly full.");}
  else msg.textContent=isAr()?"تكفي، ويتبقى "+spare+" GB.":"Fits, with "+spare+" GB to spare.";
}

function runCodec(){const o=$("#codecOut"); try{o.textContent=CODEC[$("#codecOp").value]($("#codecIn").value); o.classList.remove("err");}catch(e){o.textContent=tr("Could not decode that. ")+tr(e.message&&/needs/.test(e.message)?e.message:"Check the input matches the operation."); o.classList.add("err");}}
async function runHash(){const o=$("#hashOut"); try{const d=await crypto.subtle.digest($("#hashAlg").value,te.encode($("#hashIn").value)); o.textContent=[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join(""); o.classList.remove("err");}catch(e){o.textContent=tr("Hashing is not available in this browser context."); o.classList.add("err");}}
async function vaultKey(pass,salt){const km=await crypto.subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function vault(lock){
  const o=$("#vaultOut"), pass=$("#vaultPass").value, txt=$("#vaultIn").value.trim(); o.classList.remove("err");
  if(!pass||!txt){o.textContent=tr("Enter both a passphrase and some text."); o.classList.add("err"); return;}
  o.textContent=tr("Working…");
  try{
    if(lock){const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)); const key=await vaultKey(pass,salt);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(txt))); const all=new Uint8Array(28+ct.length); all.set(salt); all.set(iv,16); all.set(ct,28); o.textContent="OP1."+b64(all);}
    else{ if(!txt.startsWith("OP1.")) throw new Error("fmt"); const all=unb64(txt.slice(4)); const key=await vaultKey(pass,all.slice(0,16));
      o.textContent=td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:all.slice(16,28)},key,all.slice(28)));}
  }catch(e){o.textContent=tr(lock?"Locking is not available in this browser context.":(e.message==="fmt"?"That is not locked text. It should start with OP1.":"Wrong passphrase, or the locked text is damaged.")); o.classList.add("err");}
}
function fillUnits(){const u=Object.keys(UNITS[$("#cvCat").value]); const opts=u.map(x=>`<option value="${esc(x)}">${esc(tr(x))}</option>`).join(""); $("#cvFrom").innerHTML=opts; $("#cvTo").innerHTML=opts; $("#cvTo").selectedIndex=Math.min(1,u.length-1);}
function runConvert(){const v=parseFloat($("#cvVal").value), a=$("#cvFrom").value, b=$("#cvTo").value; $("#cvOut").textContent=isNaN(v)?tr("Enter a number"):fmt(v)+" "+tr(a)+" = "+fmt(convert($("#cvCat").value,v,a,b))+" "+tr(b);}
function runPass(){
  const n=+$("#pwLen").value; $("#pwLenV").textContent=n;
  let cs="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; if($("#pwSym").checked) cs+="!@#$%^&*-_=+?"; if($("#pwAmb").checked) cs=cs.replace(/[0O1lI]/g,"");
  const lim=Math.floor(4294967296/cs.length)*cs.length, buf=new Uint32Array(1); let out="";
  while(out.length<n){crypto.getRandomValues(buf); if(buf[0]<lim) out+=cs[buf[0]%cs.length];}
  $("#pwOut").textContent=out;
}
function dms(v,pos,neg){const h=v<0?neg:pos; v=Math.abs(v); let d=Math.floor(v), m=Math.floor((v-d)*60), s=Math.round(((v-d)*60-m)*600)/10; if(s>=60){s=0;m++;} if(m>=60){m=0;d++;} return d+"° "+m+"′ "+s.toFixed(1)+"″ "+h;}
function runCoord(){
  const o=$("#coOut"), t=$("#coIn").value.trim().toUpperCase(); o.classList.remove("err");
  try{
    if(/[NSEW]/.test(t)){
      const parts=[...t.matchAll(/([^NSEW]*)([NSEW])/g)].map(m=>{const n=(m[1].match(/\d+(?:\.\d+)?/g)||[]).map(Number); if(!n.length) throw 0; const v=n[0]+(n[1]||0)/60+(n[2]||0)/3600; return [m[2],(m[2]==="S"||m[2]==="W")?-v:v];});
      const lat=parts.find(p=>p[0]==="N"||p[0]==="S"), lon=parts.find(p=>p[0]==="E"||p[0]==="W"); if(!lat||!lon) throw 0;
      check(lat[1],lon[1]); o.textContent=lat[1].toFixed(5)+", "+lon[1].toFixed(5);
    }else{
      const n=(t.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number); if(n.length!==2) throw 0; check(n[0],n[1]);
      o.textContent=dms(n[0],"N","S")+"\n"+dms(n[1],"E","W");
    }
  }catch(e){o.textContent=tr("Could not read that. Use latitude then longitude, like 30.0444, 31.2357"); o.classList.add("err");}
  function check(a,b){if(Math.abs(a)>90||Math.abs(b)>180) throw 0;}
}

/* beacon */
let bT=null,bCtx=null,bGain=null;
function startBeacon(){
  const msg=$("#sosMsg").value.trim().toUpperCase(), U=240, seq=[];
  msg.split(/\s+/).forEach(w=>{[...w].forEach(ch=>{const m=MORSE[ch]; if(!m)return; [...m].forEach(s=>{seq.push([1,s==="."?U:3*U]); seq.push([0,U]);}); seq[seq.length-1][1]=3*U;}); if(seq.length) seq[seq.length-1][1]=7*U;});
  if(!seq.length){toast(tr("Type letters or numbers first")); return;}
  const el=$("#beacon"); $("#beaconMsg").textContent=msg; $("#beaconCode").textContent=toMorse(msg);
  if($("#sosSound").checked){ try{ const AC=window.AudioContext||window.webkitAudioContext; bCtx=new AC(); const osc=bCtx.createOscillator(); bGain=bCtx.createGain(); osc.frequency.value=800; bGain.gain.value=0; osc.connect(bGain); bGain.connect(bCtx.destination); osc.start(); }catch(e){bCtx=null;bGain=null;} }
  el.classList.add("show"); let i=0;
  (function step(){const [on,ms]=seq[i]; el.classList.toggle("lit",!!on); if(bGain) try{bGain.gain.setValueAtTime(on?0.25:0,bCtx.currentTime);}catch(e){} i=(i+1)%seq.length; bT=setTimeout(step,ms);})();
}
function stopBeacon(){clearTimeout(bT); bT=null; const el=$("#beacon"); el.classList.remove("show","lit"); if(bCtx){try{bCtx.close();}catch(e){} bCtx=null;bGain=null;}}

const AD=n=>Number(n).toLocaleString("ar-EG",{useGrouping:false});
const plural=(n,one,two,few,many)=>n===1?one:n===2?two:(n%100>=3&&n%100<=10)?AD(n)+" "+few:AD(n)+" "+many;
const ayahWord=n=>plural(n,"آية واحدة","آيتان","آيات","آية");
const norm=s=>String(s).replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,"").replace(/[ٱأإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();

let QD=null,QDp=null,qObs=null;
function prepQuran(d){
  const off=[0]; d.s.forEach(x=>off.push(off[off.length-1]+x.v.length));
  const gid=(s,a)=>off[s-1]+a-1;
  d.pg=d.p.map(([s,a])=>gid(s,a));                        // first verse of each page
  const pageOf=g=>{ let lo=0,hi=d.pg.length-1; while(lo<hi){ const m=(lo+hi+1)>>1; if(d.pg[m]<=g) lo=m; else hi=m-1; } return lo; };
  d.surahPage=d.s.map((_,i)=>pageOf(gid(i+1,1)));
  d.juzPage=d.j.map(([s,a])=>pageOf(gid(s,a)));
  d.juzOf=p=>{ let k=0; d.juzPage.forEach((jp,i)=>{ if(jp<=p) k=i; }); return k+1; };
  d.bas=d.s[0].v[0];                                       // بسم الله الرحمن الرحيم, same script
  d.key=d.s.map((x,i)=>norm(x.n)+" "+(i+1));
  QD=d;
}
function surahHead(s){ const x=QD.s[s-1]; return `<div class="shead"><b>سورة ${x.n}</b><span>${x.t==="m"?"مكية":"مدنية"}، ${ayahWord(x.v.length)}</span></div>`; }
function pageHtml(i){
  let [s,a]=QD.p[i]; const [es,ea]=i+1<QD.p.length?QD.p[i+1]:[115,1]; let h="",buf="";
  const flush=()=>{ if(buf){ h+=`<p class="qtext">${buf}</p>`; buf=""; } };
  while(s<es||(s===es&&a<ea)){
    if(a>QD.s[s-1].v.length){ s++; a=1; continue; }
    if(a===1){ flush(); h+=surahHead(s); if(s!==1&&s!==9) h+=`<p class="basmala">${QD.bas}</p>`; }
    buf+=`<span class="ayah">${esc(QD.s[s-1].v[a-1])}</span> <span class="ayn">﴿${AD(a)}﴾</span> `;
    a++;
  }
  flush();
  return h+`<div class="qfoot">${AD(i+1)}</div>`;
}
function fillPage(i){ const el=$("#qTrack")&&$("#qTrack").children[i]; if(el&&!el.dataset.ok){ el.innerHTML=pageHtml(i); el.dataset.ok=1; } }
function qHeader(i){
  let s=QD.p[i][0]; QD.surahPage.forEach((pg,k)=>{ if(pg===i) s=k+1; });   // a surah that starts on this page names it
  $("#qSurah").textContent="سورة "+QD.s[s-1].n;
  $("#qMeta").textContent="الجزء "+AD(QD.juzOf(i))+"، صفحة "+AD(i+1);
  $("#qPrev").disabled=i===0; $("#qNext").disabled=i===QD.p.length-1;
}
function qGo(i,smooth){
  i=Math.max(0,Math.min(QD.p.length-1,i)); [i-1,i,i+1].forEach(fillPage);

function renderDuas(){
  const v=$("#v-duas");
  if(!DD){
    v.innerHTML=`<div class="card"><p class="sub">جارٍ تحميل الأذكار…</p></div>`;
    (DDp||(DDp=getJSON("duas.json"))).then(d=>{ d.g.forEach(G=>G.c.forEach(C=>C.i.forEach(it=>it.key=norm(C.n+" "+it.z+" "+it.d)))); DD=d; if(S.view==="duas") renderDuas(); })
      .catch(()=>{ DDp=null; if(S.view==="duas") loadFail(v,"الأذكار"); });

function sanWords(s){ // turn "Nxf7+" into words a voice can read
  if(!s) return ""; const ar=GL();
  if(s.startsWith("O-O-O")) return ar?"تبييت طويل":"castles queenside"; if(s.startsWith("O-O")) return ar?"تبييت قصير":"castles kingside";
  const m=s.match(/^([KQRBN])?([a-h])?([1-8])?(x)?([a-h])([1-8])(?:=([QRBN]))?([+#])?$/); if(!m) return s;
  const PN=ar?{K:"الملك",Q:"الوزير",R:"الرخ",B:"الفيل",N:"الحصان"}:{K:"king",Q:"queen",R:"rook",B:"bishop",N:"knight"};
  let out=m[1]?PN[m[1]]+" ":""; if(m[4]) out+=(m[1]?"":(ar?"بيدق "+m[2]+" ":m[2]+" "))+(ar?"يأخذ ":"takes "); out+=m[5]+" "+m[6];
  if(m[7]) out+=(ar?" ويترقى إلى ":" promotes to ")+PN[m[7]]; if(m[8]==="+") out+=ar?"، كش":", check"; if(m[8]==="#") out+=ar?"، كش مات":", checkmate";
  return out;
}
function coachText(P,i,spoken){
  const mine=CH.mode==="bvb"?false:CH.mode!=="hot"&&P.color===CH.color||CH.mode==="hot", fill=t=>tr(t).replace(/\{n\}/g,GL()?AD(Math.abs(P.mate||P.pmate)):Math.abs(P.mate||P.pmate)).replace(/\{m\}/g,spoken?sanWords(P.san):P.san).replace(/\{b\}/g,spoken?sanWords(P.bestSan):P.bestSan);
  if(P.c==="miss"&&P.mate>0) return fill(mine?"You had checkmate in {n} with {b}! {m} lets it slip.":"They had checkmate in {n} with {b} and missed it. Lucky!");
  if(P.mate>0&&!P.best&&P.pmate>0) return fill(mine?"{m}! Forced checkmate in {n}.":"{m}. They have a forced checkmate in {n}.");
  const T=COACH[GL()?"ar":"en"][CH.mode!=="hot"&&CH.mode!=="bvb"&&P.color===CH.color?"me":"opp"][P.c], t=T[i%T.length]; return t.replace(/\{m\}/g,spoken?sanWords(P.san):P.san).replace(/\{b\}/g,spoken?sanWords(P.bestSan):P.bestSan); }

function puzApply(m){ // play one move of the solution on the board
  const E=engine(), f=m&127, t=(m>>7)&127, s=E.moveStr(m); if(!E.make(m)) return;
  CH.moves.push(s); CH.last=[f,t]; CH.sel=-1; CH.puz.hint=null; CH.puz.wrong=null; CH.puz.step++; CH.arrows=[]; CH.arrowFrom=null;
  try{ navigator.vibrate&&navigator.vibrate(12); }catch(e){}
  const P=PZ[CH.puz.i];
  if(CH.puz.step>=P.m.length){ CH.puz.done=true; CH.over="puz"; const st=puzState(); st.done[CH.puz.i]=Math.max(st.done[CH.puz.i]||0,CH.puz.fail?1:2); store.set("puz",st); drawBoard(); if(!CH.puz.fail){ ensureAudio(); ding(); } return; }
  drawBoard();
}
function puzReply(then){ const g=CH.gid; setTimeout(()=>{ if(!CH||CH.gid!==g||CH.puz.done) return; const E=engine(), P=PZ[CH.puz.i], m=E.legal().find(x=>E.moveStr(x)===P.m[CH.puz.step]); if(m!==undefined) puzApply(m); if(then) then(); },520); }
function puzMove(m){ // your move: it must be the puzzle's move (any checkmate is accepted on the last move)
  const E=engine(), P=PZ[CH.puz.i], want=P.m[CH.puz.step]; let ok=E.moveStr(m)===want;
  if(!ok&&CH.puz.step===P.m.length-1&&E.make(m)){ ok=E.inCheck()&&!E.legal().length; E.unmake(); }
  if(!ok){ CH.puz.fail=true; CH.puz.wrong=(m>>7)&127; CH.sel=-1; drawBoard(); haptic(60); toast(tr("Not the best move. Try again.")); return false; }
  const brill=isSacrifice(E,m), sn=brill?san(E,m):"";   // a correct sacrifice is a brilliant move: ding and "!!" like in a game
  puzApply(m);
  if(brill){ CH.live={ply:CH.moves.length-1,t:Date.now(),san:sn}; ensureAudio(); if(!(CH.puz.done&&!CH.puz.fail)) ding(); haptic(40); drawBoard(); }
  if(!CH.puz.done) puzReply(); return true;
}
function puzSolution(){ // show the rest of the line, one move at a time
  if(!CH||CH.mode!=="puz"||CH.puz.done) return; CH.puz.fail=true; const g=CH.gid;
  const step=()=>{ if(!CH||CH.gid!==g||CH.puz.done) return; const E=engine(), P=PZ[CH.puz.i]; if(E.turn()!==CH.color) return puzReply(step);
    const m=E.legal().find(x=>E.moveStr(x)===P.m[CH.puz.step]); if(m===undefined) return; puzApply(m); if(!CH.puz.done) puzReply(()=>setTimeout(step,350)); };
  step();
}

function sizeBlocks(){ const root=$("#gameRoot"), g=$("#bgrid"); if(!root||!g) return;

function linesIf(g){ const rows=[],cols=[]; for(let r=0;r<8;r++) if([0,1,2,3,4,5,6,7].every(c=>g[r*8+c])) rows.push(r); for(let c=0;c<8;c++) if([0,1,2,3,4,5,6,7].every(r=>g[r*8+c])) cols.push(c); return {rows,cols}; }

  if(el.dataset.go){ if(el.dataset.tool) S.tool=el.dataset.tool; if(el.dataset.cat){S.cat=el.dataset.cat; S.q="";} if(el.dataset.go==="notes") S.noteId=null; return go(el.dataset.go); }
  if(el.dataset.tool){ S.tool=el.dataset.tool; return show("tools",true); }
  if(el.dataset.cat){ S.cat=el.dataset.cat; $$("#v-field .chip").forEach(c=>c.classList.toggle("on",c.dataset.cat===S.cat)); return renderRefList(); }
  if(el.dataset.note){ S.noteId=el.dataset.note; delArm=false; return show("notes"); }
  const a=el.dataset.act;
  if(a==="lang") return setLang(isAr()?"en":"ar");
  if(a==="theme") return setTheme(S.theme==="light"?"dark":"light");
  if(a==="copyOut") return copy($("#"+el.dataset.from).textContent);
  if(a==="codecSwap"){ $("#codecIn").value=$("#codecOut").textContent; return runCodec(); }
  if(a==="lock") return vault(true);
  if(a==="unlock") return vault(false);
  if(a==="cvSwap"){ const f=$("#cvFrom"),t=$("#cvTo"),x=f.value; f.value=t.value; t.value=x; return runConvert(); }
  if(a==="pwNew") return runPass();
  if(a==="beacon") return startBeacon();
  if(a==="noteNew"){ const n={id:"n"+Date.now(),title:"",body:"",ts:Date.now()}; S.notes.push(n); saveNotes(); S.noteId=n.id; delArm=false; show("notes"); return $("#noteTitle").focus(); }
  if(a==="noteBack"){ const n=S.notes.find(x=>x.id===S.noteId); if(n&&!n.title.trim()&&!n.body.trim()){S.notes=S.notes.filter(x=>x!==n);} saveNotes(); S.noteId=null; return show("notes"); }
  if(a==="noteCopy"){ const n=S.notes.find(x=>x.id===S.noteId); return copy((n.title?n.title+"\n\n":"")+n.body); }
  if(a==="noteDel"){ if(!delArm){delArm=true; el.textContent=tr("Tap again to delete"); return;} S.notes=S.notes.filter(x=>x.id!==S.noteId); saveNotes(); S.noteId=null; delArm=false; toast(tr("Note deleted")); return show("notes"); }
  if(a==="noteBackup") return copy(JSON.stringify({outpost:1,notes:S.notes}));
  if(a==="noteRestoreGo"){ try{ const d=JSON.parse($("#noteRestore").value); if(!d||!Array.isArray(d.notes)) throw 0; let add=0; d.notes.forEach(n=>{ if(n&&typeof n.body==="string"&&!S.notes.some(x=>x.id===n.id)){ S.notes.push({id:String(n.id||"n"+Math.random()),title:String(n.title||""),body:n.body,ts:+n.ts||Date.now()}); add++; } }); saveNotes(); toast(isAr()?"استُعيدت "+add+" ملاحظة":add+" note"+(add===1?"":"s")+" restored"); show("notes",true); }catch(x){ toast(tr("That is not a valid backup")); } return; }
});

document.addEventListener("change",e=>{

  if(t.dataset.check){ S.checks[t.dataset.check]=t.checked; store.set("checks",S.checks); const id=t.dataset.check.split(".")[0], [d,n]=stackProg(id), tag=$(`[data-tag="${id}"]`); tag.textContent=d===n?tr("DONE"):d+" / "+n; tag.classList.toggle("done",d===n); return; }
  if(t.dataset.kit){ S.kit[t.dataset.kit]=t.checked; store.set("kit",S.kit); const p=progress(), tag=$("#kitTag"); tag.textContent=p.kd+" / "+p.kt; tag.classList.toggle("done",p.kd===p.kt); return; }
  if(t.dataset.plan){ S.plan[t.dataset.plan].on=t.checked; store.set("plan",S.plan); return updatePlan(); }
  if(t.id==="codecOp") return runCodec();
  if(t.id==="hashAlg") return runHash();
